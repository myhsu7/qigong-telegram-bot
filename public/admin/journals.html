<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram 學員心得流</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f7fb;color:#1f2937}
    .layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
    .sidebar{background:#111827;color:#fff;padding:20px}
    .sidebar a{display:block;color:#fff;text-decoration:none;padding:10px 12px;border-radius:10px;margin-bottom:8px}
    .sidebar a.active,.sidebar a:hover{background:#374151}
    .content{padding:24px;max-width:1100px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
    .muted{color:#6b7280}
    .journal-list{display:flex;flex-direction:column;gap:16px}
    .entry{background:#fff;border-radius:14px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
    .entry-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
    .user-link{color:#0d6efd;text-decoration:none;font-weight:700}
    .user-link:hover{text-decoration:underline}
    .date{color:#6b7280;font-size:14px}
    .tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
    .tag{border-radius:999px;padding:5px 9px;font-size:12px}
    .tag.group{background:#ede9fe;color:#6d28d9}
    .tag.leaf{background:#ecfeff;color:#0f766e}
    .note{background:#f8fafc;border-radius:12px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}
    .note-label{color:#6b7280;font-size:12px;text-transform:uppercase;font-weight:700;margin-bottom:7px}
    .pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:22px}
    button{padding:9px 14px;border:0;background:#0d6efd;color:#fff;border-radius:10px;cursor:pointer}
    button:disabled{background:#e5e7eb;color:#9ca3af;cursor:default}
    .error{background:#fee2e2;color:#991b1b;padding:14px;border-radius:10px}
    @media(max-width:800px){.layout{grid-template-columns:1fr}.content{padding:18px}.entry-head,.toolbar{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2 style="margin-top:0;">Telegram Admin</h2>
      <a href="/telegram/admin">總覽</a>
      <a href="/telegram/admin/leaderboard">排行榜</a>
      <a href="/telegram/admin/achievements">成就榜</a>
      <a href="/telegram/admin/journals" class="active">學員心得流</a>
      <a href="/telegram/admin/method-analysis">功法分析</a>
    </aside>
    <main class="content">
      <div class="toolbar">
        <h1 style="margin:0;">學員心得流</h1>
        <span id="summary" class="muted">載入中...</span>
      </div>
      <div id="journalList" class="journal-list"></div>
      <div class="pager">
        <button id="previous" type="button">← 上一頁</button>
        <span id="pageInfo" class="muted"></span>
        <button id="next" type="button">下一頁 →</button>
      </div>
    </main>
  </div>
  <script>
    let currentPage = 1;
    let totalPages = 1;
    const escapeHtml = (value) => String(value || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

    const renderEntries = (entries) => {
      const list = document.getElementById('journalList');
      if (!entries.length) {
        list.innerHTML = '<div class="entry muted">目前沒有可顯示的練功心得與感受。</div>';
        return;
      }
      list.innerHTML = entries.map((entry) => {
        const groupedTags = (entry.groupedMethods || []).map((name) => `<span class="tag group">${escapeHtml(name)}</span>`).join('');
        const leafTags = (entry.leafMethods || []).map((name) => `<span class="tag leaf">${escapeHtml(name)}</span>`).join('');
        const reflection = String(entry.reflectionNote || '').trim();
        const bodyFeeling = String(entry.bodyFeelingNote || '').trim();
        const legacyNote = reflection && bodyFeeling ? `${reflection}\n${bodyFeeling}` : reflection || bodyFeeling;
        const practiceNote = entry.practiceNote || legacyNote;
        return `<article class="entry">
          <div class="entry-head">
            <a class="user-link" href="/telegram/admin/method-analysis?userId=${encodeURIComponent(entry.telegramUserId)}&name=${encodeURIComponent(entry.displayName)}">${escapeHtml(entry.displayName)}</a>
            <span class="date">${escapeHtml(entry.date)}</span>
          </div>
          <div class="tags">${groupedTags}${leafTags}</div>
          <div class="note"><div class="note-label">練功心得與感受</div>${escapeHtml(practiceNote || '未填寫')}</div>
        </article>`;
      }).join('');
    };

    const load = async (page) => {
      const res = await fetch(`/telegram/admin/api/journals?page=${page}&limit=20`);
      if (!res.ok) throw new Error('Failed to load journals');
      const data = await res.json();
      currentPage = data.page;
      totalPages = data.totalPages;
      document.getElementById('summary').textContent = `共 ${data.total} 筆｜每頁 20 筆`;
      document.getElementById('pageInfo').textContent = `第 ${currentPage} / ${totalPages} 頁`;
      document.getElementById('previous').disabled = currentPage <= 1;
      document.getElementById('next').disabled = currentPage >= totalPages;
      renderEntries(data.entries || []);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    document.getElementById('previous').onclick = () => { if (currentPage > 1) load(currentPage - 1); };
    document.getElementById('next').onclick = () => { if (currentPage < totalPages) load(currentPage + 1); };
    load(1).catch((error) => {
      console.error('[admin-journals] load failed', error);
      document.getElementById('summary').textContent = '';
      document.getElementById('journalList').innerHTML = '<div class="error">心得資料載入失敗，請稍後再試。</div>';
    });
  </script>
</body>
</html>
