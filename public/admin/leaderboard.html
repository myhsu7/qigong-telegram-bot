<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram 排行榜</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f7fb;color:#1f2937}
    .layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
    .sidebar{background:#111827;color:#fff;padding:20px}
    .sidebar a{display:block;color:#fff;text-decoration:none;padding:10px 12px;border-radius:10px;margin-bottom:8px}
    .sidebar a.active,.sidebar a:hover{background:#374151}
    .content{padding:24px}
    .card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.08);margin-bottom:20px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee}
    .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
    button{padding:10px 14px;border:0;background:#0d6efd;color:#fff;border-radius:10px;cursor:pointer}
    .ghost{background:#e5e7eb;color:#111827}
    .user-link{color:#0d6efd;text-decoration:none;font-weight:600}
    .user-link:hover{text-decoration:underline}
    .controls{display:flex;gap:8px;flex-wrap:wrap}
    .pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
    .pager span{color:#6b7280;font-size:14px}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}
   </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2 style="margin-top:0;">Telegram Admin</h2>
      <a href="/telegram/admin">總覽</a>
      <a href="/telegram/admin/leaderboard" class="active">排行榜</a>
      <a href="/telegram/admin/achievements">成就榜</a>
      <a href="/telegram/admin/journals">學員心得流</a>
      <a href="/telegram/admin/method-analysis">功法分析</a>
    </aside>
    <main class="content">
      <div class="row">
        <h1 style="margin:0;">排行榜</h1>
        <div class="controls">
          <button data-period="week">本週</button>
          <button data-period="month" class="ghost">本月</button>
          <button data-period="quarter" class="ghost">本季</button>
          <button data-period="year" class="ghost">本年</button>
        </div>
      </div>
      <div class="grid" style="margin-top:20px;">
        <div class="card">
          <div class="row">
            <h2 style="margin-top:0;">生涯總打卡天數（全員榜）</h2>
            <span id="totalUsers" style="color:#6b7280;"></span>
          </div>
          <table id="totalsTable"></table>
          <div class="pager">
            <button id="totalsPrev" class="ghost" type="button">← 上一頁</button>
            <span id="totalsPageInfo"></span>
            <button id="totalsNext" class="ghost" type="button">下一頁 →</button>
          </div>
        </div>
        <div class="card">
          <div class="row" style="align-items:flex-start;flex-wrap:wrap;">
            <h2 id="streakTitle" style="margin-top:0;">最長連續打卡 Top 10</h2>
            <div class="controls">
              <button data-limit="10" type="button">Top 10</button>
              <button data-limit="20" class="ghost" type="button">Top 20</button>
              <button data-limit="30" class="ghost" type="button">Top 30</button>
            </div>
          </div>
          <table id="streaksTable"></table>
        </div>
      </div>
    </main>
  </div>
  <script>
    let currentPeriod = 'week';
    let streakLimit = 10;
    let totalsPage = 1;
    let totalsTotalPages = 1;
    const periodButtons = [...document.querySelectorAll('[data-period]')];
    const limitButtons = [...document.querySelectorAll('[data-limit]')];
    const escapeHtml = (value) => String(value || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    const setActive = () => {
      periodButtons.forEach(btn => btn.className = btn.dataset.period === currentPeriod ? '' : 'ghost');
      limitButtons.forEach(btn => btn.className = Number(btn.dataset.limit) === streakLimit ? '' : 'ghost');
    };
    const renderTable = (el, rows, valueKey, suffix, rankOffset = 0, showDetails = false) => {
      let html = `<thead><tr><th>#</th><th>名稱</th><th>${showDetails ? '總天數' : '數值'}</th>${showDetails ? '<th>目前連續</th><th>最近打卡</th>' : ''}</tr></thead><tbody>`;
      if (!rows.length) html += `<tr><td colspan="${showDetails ? 5 : 3}" style="color:#6b7280;">目前沒有資料</td></tr>`;
      rows.forEach((row, i) => {
        const name = escapeHtml(row.displayName);
        const link = row.telegramUserId
          ? `<a class="user-link" href="/telegram/admin/method-analysis?userId=${encodeURIComponent(row.telegramUserId)}&name=${encodeURIComponent(row.displayName)}">${name}</a>`
          : name;
        html += `<tr><td>${rankOffset+i+1}</td><td>${link}</td><td>${Number(row[valueKey] || 0)}${suffix}</td>${showDetails ? `<td>${Number(row.currentStreak || 0)}天</td><td>${escapeHtml(row.lastCheckinDate || '-')}</td>` : ''}</tr>`;
      });
      html += '</tbody>';
      el.innerHTML = html;
    };
    const load = async () => {
      const res = await fetch(`/telegram/admin/api/leaderboard?period=${currentPeriod}&limit=${streakLimit}&page=${totalsPage}`);
      if (!res.ok) throw new Error('Failed to load leaderboard');
      const data = await res.json();
      const totals = data.totalsPage || { rows: data.totals || [], total: 0, page: 1, totalPages: 1, limit: 20 };
      totalsTotalPages = totals.totalPages;
      renderTable(document.getElementById('totalsTable'), totals.rows || [], 'totalDays', '天', (totals.page - 1) * totals.limit, true);
      renderTable(document.getElementById('streaksTable'), data.streaks || [], 'maxStreak', '天');
      document.getElementById('totalUsers').textContent = `共 ${totals.total} 人｜每頁 20 人`;
      document.getElementById('totalsPageInfo').textContent = `第 ${totals.page} / ${totals.totalPages} 頁`;
      document.getElementById('totalsPrev').disabled = totals.page <= 1;
      document.getElementById('totalsNext').disabled = totals.page >= totals.totalPages;
      document.getElementById('streakTitle').textContent = `最長連續打卡 Top ${streakLimit}`;
    };
    periodButtons.forEach(btn => btn.onclick = () => { currentPeriod = btn.dataset.period; setActive(); load(); });
    limitButtons.forEach(btn => btn.onclick = () => { streakLimit = Number(btn.dataset.limit); setActive(); load(); });
    document.getElementById('totalsPrev').onclick = () => { if (totalsPage > 1) { totalsPage -= 1; load(); } };
    document.getElementById('totalsNext').onclick = () => { if (totalsPage < totalsTotalPages) { totalsPage += 1; load(); } };
    setActive();
    load().catch((error) => console.error('[admin-leaderboard] load failed', error));
  </script>
</body>
</html>
