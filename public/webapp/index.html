<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>氣功打卡</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f6f7fb; color: #1f2937; }
    .container { max-width: 640px; margin: 0 auto; padding: 20px; }
    .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.08); margin-bottom: 16px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .muted { color: #6b7280; font-size: 14px; }
    .method-group { border-bottom: 1px solid #f3f4f6; padding: 6px 0; }
    .method-group:last-child { border-bottom: 0; }
    .method-row { display: flex; align-items: center; gap: 10px; }
    .method-label { display: flex; align-items: center; gap: 10px; flex: 1; padding: 8px 0; }
    .toggle-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; color: #374151; font-size: 18px; line-height: 1; padding: 0; flex-shrink: 0; }
    .toggle-spacer { width: 30px; height: 30px; flex-shrink: 0; }
    .child-list { margin-left: 40px; padding-bottom: 4px; }
    .child-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
    .child-label { display: flex; align-items: center; gap: 10px; flex: 1; color: #4b5563; }
    .method-hint { color: #9ca3af; font-size: 12px; }
    .feeling-hint { margin: 10px 0 8px; }
    .feeling-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .feeling-tag { width: auto; padding: 8px 12px; border: 1px solid #93c5fd; border-radius: 999px; background: #eff6ff; color: #1d4ed8; font-size: 14px; font-weight: 500; }
    .feeling-tag.selected { background: #0d6efd; border-color: #0d6efd; color: #fff; }
    textarea { width: 100%; min-height: 96px; border: 1px solid #d1d5db; border-radius: 10px; padding: 12px; font-size: 14px; box-sizing: border-box; }
    button { width: 100%; background: #0d6efd; color: #fff; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:disabled { background: #9ca3af; }
    .hint { background: #eff6ff; color: #1d4ed8; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
    .status { margin-top: 12px; font-size: 14px; }
    .error { color: #b91c1c; }
    .success { color: #166534; }
    .language-row { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    .language-select { width: auto; border: 1px solid #d1d5db; border-radius: 10px; background: #fff; color: #1f2937; padding: 8px 10px; font-size: 14px; }
    .timezone-card { border: 1px solid #bfdbfe; }
    .timezone-row { display: flex; gap: 8px; align-items: center; }
    .timezone-input { flex: 1; min-width: 0; border: 1px solid #d1d5db; border-radius: 10px; padding: 11px; font-size: 14px; }
    .timezone-button { width: auto; padding: 11px 14px; }
    .date-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .date-tab { background: #e5e7eb; color: #374151; }
    .date-tab.active { background: #0d6efd; color: #fff; }
    .date-tab.makeup.active { background: #b45309; }
    .makeup-hint { margin: 10px 0 0; color: #92400e; }
    .makeup-mode { border: 2px solid #f59e0b; }
    @media (max-width: 480px) { .timezone-row { align-items: stretch; flex-direction: column; } .timezone-button { width: 100%; } .date-tabs { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="language-row"><select id="languageSelect" class="language-select" aria-label="語言"><option value="zh_TW">繁體中文</option><option value="zh_CN">简体中文</option><option value="en">English</option></select></div>
       <div id="timezoneCard" class="card timezone-card" hidden>
      <h2 data-i18n="timezoneHeading">設定練功時區</h2>
      <p class="muted" data-i18n="timezoneIntro">練功日期與補登期限會依此時區計算，請確認後再打卡。</p>
      <div class="timezone-row"><input id="timezoneInput" class="timezone-input" list="timezoneOptions" autocomplete="off"><button id="saveTimezone" class="timezone-button" type="button" data-i18n="confirmTimezone">確認時區</button></div>
      <datalist id="timezoneOptions"><option value="Asia/Taipei"><option value="Asia/Hong_Kong"><option value="Asia/Singapore"><option value="Asia/Tokyo"><option value="Europe/London"><option value="Europe/Paris"><option value="America/New_York"><option value="America/Chicago"><option value="America/Denver"><option value="America/Los_Angeles"><option value="Australia/Sydney"></datalist>
      <div id="timezoneStatus" class="status"></div>
    </div>
    <div class="card">
      <h1 data-i18n="heading">今日打卡</h1>
      <p class="muted" data-i18n="intro">請勾選今天練習的功法，並可選填練功心得與感受。</p>
      <p class="muted"><span id="timezoneLabel"></span> <button id="changeTimezone" class="timezone-button" type="button">變更</button></p>
      <div id="dateTabs" class="date-tabs" hidden><button id="todayTab" class="date-tab active" type="button"></button><button id="makeupTab" class="date-tab makeup" type="button"></button></div>
      <p id="makeupHint" class="muted makeup-hint"></p>
      <div class="hint" id="todayStatus"></div>
    </div>

    <div id="methodsCard" class="card" hidden>
      <h2 data-i18n="methodsHeading">今日功法（可複選）</h2>
      <div id="methodsContainer"></div>
    </div>

    <div id="noteCard" class="card" hidden>
      <h2 data-i18n="practiceNoteHeading">練功心得與身體感受（選填）</h2>
      <textarea id="practiceNote" maxlength="1000"></textarea>
      <p id="feelingTagsHint" class="muted feeling-hint" data-i18n="feelingTagsHint" hidden>快速選擇感受（可複選）</p>
      <div id="feelingTags" class="feeling-tags"></div>
    </div>

    <button type="button" id="submitButton" data-i18n="submit" hidden>完成打卡</button>
    <div id="submitStatus" class="status"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const translations = {
      zh_TW: {
        title: '氣功打卡', language: '語言', heading: '練功打卡', intro: '請選擇練功日期與功法，並可選填心得與感受。', timezoneHeading: '設定練功時區', timezoneIntro: '練功日期與補登期限會依此時區計算，請確認後再打卡。', confirmTimezone: '確認時區', timezoneLabel: (z) => `練功時區：${z}`, timezoneSaved: '練功時區已儲存。', timezonePending: (z,d) => `新時區 ${z} 將於 ${d} 生效。`, timezoneSaveFailed: '時區儲存失敗：', todayTab: (d) => `今天 ${d}`, makeupTab: (d) => `補登昨天 ${d}`, makeupClosed: (d) => `昨天 ${d} 的補登期限已於當地中午 12:00 結束。`, makeupAvailable: '昨天若有練功，可於當地中午 12:00 前補登。', loadingToday: '正在載入打卡資料...', methodsHeading: '練習功法（可複選）', practiceNoteHeading: '練功心得與身體感受（選填）', feelingTagsHint: '快速選擇感受（可複選）', practiceNotePlaceholder: '記錄練功心得、身體感受或其他體會...', submitToday: (d) => `完成 ${d} 打卡`, submitMakeup: (d) => `完成 ${d} 補登`, selectAllChildren: '勾選即全選子招式', authError: '尚未取得 Telegram 驗證資訊，請從 Telegram App 內重新開啟打卡頁。', requestFailed: '請求失敗', methodsLoadFailed: '功法列表載入失敗：', feelingTagsLoadFailed: '快速感受標籤載入失敗：', todayLoadFailed: '打卡資料載入失敗：', noteTooLong: '心得與感受最多 1000 字，無法加入此標籤。', alreadyCheckedIn: (d) => `${d} 已打卡，可在期限內修改內容。`, notCheckedIn: (d,m) => m ? `${d} 尚未打卡，可於中午 12:00 前補登。` : `${d} 尚未打卡。`, loadFailed: '載入失敗：', selectMethod: '請至少勾選一個功法。', saving: '正在儲存打卡資料...', streak: (n) => `連續 ${n} 天`, total: (n) => `總計 ${n} 天`, unlocked: '解鎖：', successToday: (d) => `${d} 打卡成功：`, successMakeup: (d) => `${d} 補登成功：`, saved: (d,m) => `${d} 的${m ? '補登' : '打卡'}內容已儲存。`, saveFailed: '儲存失敗：'
      },
      zh_CN: {
        title: '气功打卡', language: '语言', heading: '练功打卡', intro: '请选择练功日期与功法，并可选填心得与感受。', timezoneHeading: '设置练功时区', timezoneIntro: '练功日期与补登期限会依此时区计算，请确认后再打卡。', confirmTimezone: '确认时区', timezoneLabel: (z) => `练功时区：${z}`, timezoneSaved: '练功时区已保存。', timezonePending: (z,d) => `新时区 ${z} 将于 ${d} 生效。`, timezoneSaveFailed: '时区保存失败：', todayTab: (d) => `今天 ${d}`, makeupTab: (d) => `补登昨天 ${d}`, makeupClosed: (d) => `昨天 ${d} 的补登期限已于当地中午 12:00 结束。`, makeupAvailable: '昨天若有练功，可于当地中午 12:00 前补登。', loadingToday: '正在加载打卡数据...', methodsHeading: '练习功法（可多选）', practiceNoteHeading: '练功心得与身体感受（选填）', feelingTagsHint: '快速选择感受（可多选）', practiceNotePlaceholder: '记录练功心得、身体感受或其他体会...', submitToday: (d) => `完成 ${d} 打卡`, submitMakeup: (d) => `完成 ${d} 补登`, selectAllChildren: '勾选即全选子招式', authError: '尚未取得 Telegram 验证信息，请从 Telegram App 内重新打开打卡页。', requestFailed: '请求失败', methodsLoadFailed: '功法列表加载失败：', feelingTagsLoadFailed: '快速感受标签加载失败：', todayLoadFailed: '打卡数据加载失败：', noteTooLong: '心得与感受最多 1000 字，无法加入此标签。', alreadyCheckedIn: (d) => `${d} 已打卡，可在期限内修改内容。`, notCheckedIn: (d,m) => m ? `${d} 尚未打卡，可于中午 12:00 前补登。` : `${d} 尚未打卡。`, loadFailed: '加载失败：', selectMethod: '请至少选择一个功法。', saving: '正在保存打卡数据...', streak: (n) => `连续 ${n} 天`, total: (n) => `总计 ${n} 天`, unlocked: '解锁：', successToday: (d) => `${d} 打卡成功：`, successMakeup: (d) => `${d} 补登成功：`, saved: (d,m) => `${d} 的${m ? '补登' : '打卡'}内容已保存。`, saveFailed: '保存失败：'
      },
      en: {
        title: 'Qigong Check-in', language: 'Language', heading: 'Practice Check-in', intro: 'Choose the practice date and methods. You may also add a reflection.', timezoneHeading: 'Set practice time zone', timezoneIntro: 'Practice dates and make-up deadlines use this time zone. Confirm it before checking in.', confirmTimezone: 'Confirm time zone', timezoneLabel: (z) => `Practice time zone: ${z}`, timezoneSaved: 'Practice time zone saved.', timezonePending: (z,d) => `${z} will take effect on ${d}.`, timezoneSaveFailed: 'Could not save time zone: ', todayTab: (d) => `Today · ${d}`, makeupTab: (d) => `Make up yesterday · ${d}`, makeupClosed: (d) => `The make-up window for ${d} closed at 12:00 PM local time.`, makeupAvailable: 'If you practiced yesterday, you can make it up before 12:00 PM local time.', loadingToday: 'Loading check-in...', methodsHeading: 'Practice Methods (select all that apply)', practiceNoteHeading: 'Practice Reflection and Physical Sensations (optional)', feelingTagsHint: 'Quick sensations (select all that apply)', practiceNotePlaceholder: 'Record reflections, physical sensations, or anything else you noticed...', submitToday: (d) => `Complete ${d} check-in`, submitMakeup: (d) => `Complete ${d} make-up`, selectAllChildren: 'Selects all child forms', authError: 'Telegram authentication is unavailable. Please reopen this page in the Telegram app.', requestFailed: 'Request failed', methodsLoadFailed: 'Could not load practice methods: ', feelingTagsLoadFailed: 'Could not load quick sensation tags: ', todayLoadFailed: 'Could not load check-in: ', noteTooLong: 'The note is limited to 1,000 characters, so this tag cannot be added.', alreadyCheckedIn: (d) => `${d} is already checked in and can be edited within the allowed window.`, notCheckedIn: (d,m) => m ? `${d} is not recorded yet. Make it up before 12:00 PM.` : `${d} is not recorded yet.`, loadFailed: 'Could not load data: ', selectMethod: 'Select at least one practice method.', saving: 'Saving your check-in...', streak: (n) => `${n}-day streak`, total: (n) => `${n} days total`, unlocked: 'Unlocked: ', successToday: (d) => `${d} check-in complete: `, successMakeup: (d) => `${d} make-up complete: `, saved: (d,m) => `${d} ${m ? 'make-up' : 'check-in'} saved.`, saveFailed: 'Could not save: '
      }
    };
    const localeKey = 'qigong_telegram_locale';
    const telegramLanguage = tg?.initDataUnsafe?.user?.language_code || '';
    const mapLocale = (code) => ['zh-hans', 'zh-cn', 'zh-sg'].includes(String(code).toLowerCase()) ? 'zh_CN' : (/^en(?:-|$)/i.test(String(code)) ? 'en' : 'zh_TW');
    const storedLocale = localStorage.getItem(localeKey);
    let locale = translations[storedLocale] ? storedLocale : mapLocale(telegramLanguage);
    let t = translations[locale];

    const methodsContainer = document.getElementById('methodsContainer');
    const practiceNote = document.getElementById('practiceNote');
    const feelingTags = document.getElementById('feelingTags');
    const feelingTagsHint = document.getElementById('feelingTagsHint');
    const submitButton = document.getElementById('submitButton');
    const submitStatus = document.getElementById('submitStatus');
    const todayStatus = document.getElementById('todayStatus');
    const languageSelect = document.getElementById('languageSelect');
    const timezoneCard = document.getElementById('timezoneCard');
    const timezoneInput = document.getElementById('timezoneInput');
    const timezoneStatus = document.getElementById('timezoneStatus');
    const saveTimezone = document.getElementById('saveTimezone');
    const changeTimezone = document.getElementById('changeTimezone');
    const timezoneLabel = document.getElementById('timezoneLabel');
    const dateTabs = document.getElementById('dateTabs');
    const todayTab = document.getElementById('todayTab');
    const makeupTab = document.getElementById('makeupTab');
    const makeupHint = document.getElementById('makeupHint');
    const methodsCard = document.getElementById('methodsCard');
    const noteCard = document.getElementById('noteCard');
    let practiceMethods = [];
    let selectedMethodIds = new Set();
    let expandedMethodIds = new Set();
    let profileReady = false;
    let practiceFeelingTags = [];
    let profile = null;
    let selectedDate = '';
    let loadedDate = '';
    const drafts = new Map();

    const getInitData = () => window.Telegram?.WebApp?.initData || '';
    const localizedUrl = (url) => `${url}${url.includes('?') ? '&' : '?'}locale=${encodeURIComponent(locale)}`;
    const getMethodName = (method) => (locale === 'en' ? method.nameEn : locale === 'zh_CN' ? method.nameZhCn : method.nameZh) || method.nameZh || '';
    const getFeelingTagName = (tag) => (locale === 'en' ? tag.nameEn : locale === 'zh_CN' ? tag.nameZhCn : tag.nameZh) || tag.nameZh || '';
    const mergeLegacyNotes = (reflection = '', bodyFeeling = '') => {
      const reflectionText = reflection.trim();
      const bodyFeelingText = bodyFeeling.trim();
      if (!reflectionText || !bodyFeelingText) return reflectionText || bodyFeelingText;
      return `${reflectionText}\n${bodyFeelingText}`;
    };

    const applyTranslations = () => {
      t = translations[locale];
      document.documentElement.lang = locale === 'en' ? 'en' : locale === 'zh_CN' ? 'zh-Hans' : 'zh-Hant';
      document.title = t.title;
      document.querySelectorAll('[data-i18n]').forEach((element) => { element.textContent = t[element.dataset.i18n]; });
      languageSelect.value = locale;
      languageSelect.setAttribute('aria-label', t.language);
      practiceNote.placeholder = t.practiceNotePlaceholder;
      if (profile) renderDateControls();
    };

    const noteLines = () => practiceNote.value.split('\n').map((line) => line.trim()).filter(Boolean);
    const getFeelingTagNames = (tag) => [...new Set([tag.nameZh, tag.nameZhCn, tag.nameEn].filter(Boolean))];
    const renderFeelingTags = () => {
      feelingTags.replaceChildren();
      feelingTagsHint.hidden = practiceFeelingTags.length === 0;
      const lines = new Set(noteLines());
      practiceFeelingTags.forEach((tag) => {
        const label = getFeelingTagName(tag);
        if (!label) return;
        const button = document.createElement('button');
        const selected = getFeelingTagNames(tag).some((name) => lines.has(name));
        button.type = 'button';
        button.className = `feeling-tag${selected ? ' selected' : ''}`;
        button.textContent = label;
        button.setAttribute('aria-pressed', String(selected));
        button.addEventListener('click', () => toggleFeelingTag(tag));
        feelingTags.append(button);
      });
    };

    const toggleFeelingTag = (tag) => {
      const label = getFeelingTagName(tag);
      const tagNames = new Set(getFeelingTagNames(tag));
      const lines = practiceNote.value.split('\n');
      const existingIndex = lines.findIndex((line) => tagNames.has(line.trim()));
      if (existingIndex >= 0) {
        lines.splice(existingIndex, 1);
        practiceNote.value = lines.join('\n').replace(/^\n+|\n+$/g, '');
      } else {
        const next = practiceNote.value.trim() ? `${practiceNote.value.replace(/\s+$/, '')}\n${label}` : label;
        if (next.length > practiceNote.maxLength) {
          setStatus(submitStatus, t.noteTooLong, 'error');
          return;
        }
        practiceNote.value = next;
      }
      renderFeelingTags();
      practiceNote.focus();
    };

    practiceNote.addEventListener('input', renderFeelingTags);

    const setStatus = (el, message, className = '') => {
      el.textContent = message;
      el.className = `status ${className}`.trim();
    };

    const shortDate = (date) => date.slice(5).replace('-', '/');
    const isMakeupMode = () => profile && selectedDate === profile.yesterday;
    const snapshotDraft = () => {
      if (!loadedDate) return;
      drafts.set(loadedDate, { selectedMethodIds: [...selectedMethodIds], practiceNote: practiceNote.value });
    };
    const renderDateControls = () => {
      timezoneLabel.textContent = t.timezoneLabel(profile.practiceTimezone);
      changeTimezone.textContent = locale === 'en' ? 'Change' : locale === 'zh_CN' ? '更改' : '變更';
      methodsCard.hidden = !profile.confirmed;
      noteCard.hidden = !profile.confirmed;
      submitButton.hidden = !profile.confirmed;
      dateTabs.hidden = !profile.confirmed;
      todayTab.textContent = t.todayTab(shortDate(profile.today));
      makeupTab.textContent = profile.canMakeupYesterday ? t.makeupTab(shortDate(profile.yesterday)) : `${t.makeupTab(shortDate(profile.yesterday))} · 12:00`;
      makeupTab.disabled = !profile.canMakeupYesterday;
      todayTab.classList.toggle('active', selectedDate === profile.today);
      makeupTab.classList.toggle('active', selectedDate === profile.yesterday);
      makeupHint.textContent = profile.canMakeupYesterday ? t.makeupAvailable : t.makeupClosed(shortDate(profile.yesterday));
      document.querySelector('.container').classList.toggle('makeup-mode', isMakeupMode());
      submitButton.textContent = isMakeupMode() ? t.submitMakeup(shortDate(selectedDate)) : t.submitToday(shortDate(selectedDate || profile.today));
    };

    const applyCheckinData = (data) => {
      selectedDate = data.date;
      loadedDate = data.date;
      renderMethods(practiceMethods, data.selectedMethodIds);
      practiceNote.value = data.practiceNote || mergeLegacyNotes(data.reflectionNote, data.bodyFeelingNote);
      renderFeelingTags();
      renderDateControls();
      todayStatus.textContent = data.alreadyCheckedIn
        ? t.alreadyCheckedIn(shortDate(data.date))
        : t.notCheckedIn(shortDate(data.date), isMakeupMode());
      drafts.set(data.date, { selectedMethodIds: [...selectedMethodIds], practiceNote: practiceNote.value, alreadyCheckedIn: data.alreadyCheckedIn });
    };

    const loadCheckinDate = async (date) => {
      snapshotDraft();
      selectedDate = date;
      renderDateControls();
      submitStatus.textContent = '';
      const draft = drafts.get(date);
      if (draft) {
        loadedDate = date;
        renderMethods(practiceMethods, draft.selectedMethodIds);
        practiceNote.value = draft.practiceNote;
        renderFeelingTags();
        todayStatus.textContent = draft.alreadyCheckedIn
          ? t.alreadyCheckedIn(shortDate(date))
          : t.notCheckedIn(shortDate(date), isMakeupMode());
        return;
      }
      todayStatus.textContent = t.loadingToday;
      todayStatus.className = 'hint';
      const data = await apiFetch(`/telegram/api/webapp/checkin?date=${encodeURIComponent(date)}`);
      applyCheckinData(data);
    };

    const apiFetch = async (url, options = {}, includeLocale = true) => {
      const initData = getInitData();
      if (!initData) {
        throw new Error(t.authError);
      }
      const headers = new Headers(options.headers || {});
      headers.set('x-telegram-init-data', initData);
      if (!headers.has('Content-Type') && options.method && options.method !== 'GET') {
        headers.set('Content-Type', 'application/json');
      }
      const res = await fetch(includeLocale ? localizedUrl(url) : url, { ...options, headers });
      if (!res.ok) {
        const body = await res.json().catch(() => ({ error: t.requestFailed }));
        throw new Error(body.error || t.requestFailed);
      }
      return res.status === 204 ? null : res.json();
    };

    const persistProfileLocale = (nextLocale) => apiFetch('/telegram/api/webapp/profile/language', {
      method: 'PATCH',
      body: JSON.stringify({ locale: nextLocale })
    }, false);

    const refreshProfile = async () => {
      const refreshed = await apiFetch('/telegram/api/webapp/profile', {}, false);
      profile = refreshed;
      renderDateControls();
      return refreshed;
    };

    const normalizeSelectedIds = (methods, selectedIds) => {
      const normalized = new Set();
      const incoming = new Set(selectedIds);

      methods.forEach((method) => {
        if (method.children && method.children.length > 0) {
          if (incoming.has(method.id)) {
            method.children.forEach((child) => normalized.add(child.id));
          }
          method.children.forEach((child) => {
            if (incoming.has(child.id)) normalized.add(child.id);
          });
          return;
        }

        if (incoming.has(method.id)) {
          normalized.add(method.id);
        }
      });

      return normalized;
    };

    const getParentSelectionState = (method) => {
      if (!method.children || method.children.length === 0) {
        return { checked: selectedMethodIds.has(method.id), indeterminate: false };
      }

      const selectedCount = method.children.filter((child) => selectedMethodIds.has(child.id)).length;
      return {
        checked: selectedCount === method.children.length,
        indeterminate: selectedCount > 0 && selectedCount < method.children.length
      };
    };

    const redrawMethods = () => {
      methodsContainer.innerHTML = '';
      practiceMethods.forEach((method) => {
        const group = document.createElement('div');
        group.className = 'method-group';

        const row = document.createElement('div');
        row.className = 'method-row';

        if (method.children && method.children.length > 0) {
          const toggleButton = document.createElement('button');
          toggleButton.type = 'button';
          toggleButton.className = 'toggle-btn';
          toggleButton.dataset.action = 'toggle';
          toggleButton.dataset.methodId = String(method.id);
          toggleButton.textContent = expandedMethodIds.has(method.id) ? '−' : '+';
          row.appendChild(toggleButton);
        } else {
          const spacer = document.createElement('span');
          spacer.className = 'toggle-spacer';
          row.appendChild(spacer);
        }

        const label = document.createElement('label');
        label.className = 'method-label';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.dataset.action = 'parent-check';
        checkbox.dataset.methodId = String(method.id);

        const state = getParentSelectionState(method);
        checkbox.checked = state.checked;
        checkbox.indeterminate = state.indeterminate;

        const textWrap = document.createElement('div');
        textWrap.appendChild(document.createTextNode(getMethodName(method)));
        if (method.children && method.children.length > 0) {
          const hint = document.createElement('span');
          hint.className = 'method-hint';
          hint.textContent = ` ${t.selectAllChildren}`;
          textWrap.appendChild(hint);
        }

        label.appendChild(checkbox);
        label.appendChild(textWrap);
        row.appendChild(label);
        group.appendChild(row);

        if (method.children && method.children.length > 0 && expandedMethodIds.has(method.id)) {
          const childList = document.createElement('div');
          childList.className = 'child-list';

          method.children.forEach((child) => {
            const childRow = document.createElement('div');
            childRow.className = 'child-row';

            const childLabel = document.createElement('label');
            childLabel.className = 'child-label';

            const childCheckbox = document.createElement('input');
            childCheckbox.type = 'checkbox';
            childCheckbox.dataset.action = 'child-check';
            childCheckbox.dataset.methodId = String(child.id);
            childCheckbox.checked = selectedMethodIds.has(child.id);

            const childText = document.createElement('span');
            childText.textContent = getMethodName(child);

            childLabel.appendChild(childCheckbox);
            childLabel.appendChild(childText);
            childRow.appendChild(childLabel);
            childList.appendChild(childRow);
          });

          group.appendChild(childList);
        }

        methodsContainer.appendChild(group);
      });
    };

    const getSelectedMethodIds = () => {
      const ids = [];
      practiceMethods.forEach((method) => {
        if (method.children && method.children.length > 0) {
          method.children.forEach((child) => {
            if (selectedMethodIds.has(child.id)) ids.push(child.id);
          });
        } else if (selectedMethodIds.has(method.id)) {
          ids.push(method.id);
        }
      });
      return ids;
    };

    const renderMethods = (methods, selectedIds = []) => {
      practiceMethods = methods;
      selectedMethodIds = normalizeSelectedIds(methods, selectedIds);
      expandedMethodIds = new Set(methods.filter((method) => {
        if (!method.children || method.children.length === 0) return false;
        return method.children.some((child) => selectedMethodIds.has(child.id)) || selectedIds.includes(method.id);
      }).map((method) => method.id));
      redrawMethods();
    };

    methodsContainer.addEventListener('click', (event) => {
      const toggleButton = event.target.closest('button[data-action="toggle"]');
      if (!toggleButton) return;

      const methodId = Number(toggleButton.dataset.methodId);
      if (expandedMethodIds.has(methodId)) {
        expandedMethodIds.delete(methodId);
      } else {
        expandedMethodIds.add(methodId);
      }
      redrawMethods();
    });

    methodsContainer.addEventListener('change', (event) => {
      const target = event.target;
      if (!(target instanceof HTMLInputElement)) return;

      if (target.dataset.action === 'parent-check') {
        const methodId = Number(target.dataset.methodId);
        const method = practiceMethods.find((item) => item.id === methodId);
        if (!method) return;

        if (method.children && method.children.length > 0) {
          method.children.forEach((child) => {
            if (target.checked) selectedMethodIds.add(child.id);
            else selectedMethodIds.delete(child.id);
          });
        } else if (target.checked) {
          selectedMethodIds.add(method.id);
        } else {
          selectedMethodIds.delete(method.id);
        }

        redrawMethods();
        return;
      }

      if (target.dataset.action === 'child-check') {
        const methodId = Number(target.dataset.methodId);
        if (target.checked) selectedMethodIds.add(methodId);
        else selectedMethodIds.delete(methodId);
        redrawMethods();
      }
    });

    const load = async () => {
      if (!profileReady && getInitData()) return;
      todayStatus.textContent = t.loadingToday;
      todayStatus.className = 'hint';
      submitStatus.textContent = '';
      try {
        if (!getInitData()) {
          todayStatus.textContent = t.authError;
          todayStatus.className = 'hint error';
          return;
        }

        const [methodsResp, todayResp, feelingTagsResp] = await Promise.all([
          apiFetch('/telegram/api/webapp/practice-methods').catch((error) => { throw new Error(`${t.methodsLoadFailed}${error.message}`); }),
          apiFetch(`/telegram/api/webapp/checkin?date=${encodeURIComponent(selectedDate || profile.today)}`).catch((error) => { throw new Error(`${t.todayLoadFailed}${error.message}`); }),
          apiFetch('/telegram/api/webapp/practice-feeling-tags').catch((error) => {
            console.error(`${t.feelingTagsLoadFailed}${error.message}`);
            return { tags: [] };
          })
        ]);

        practiceMethods = methodsResp.methods;
        practiceFeelingTags = feelingTagsResp.tags;
        applyCheckinData(todayResp);
      } catch (error) {
        todayStatus.textContent = `${t.loadFailed}${error.message}`;
        todayStatus.className = 'hint error';
      }
    };

    submitButton.addEventListener('click', async () => {
      const methodIds = getSelectedMethodIds();
      if (methodIds.length === 0) {
        setStatus(submitStatus, t.selectMethod, 'error');
        return;
      }

      submitButton.disabled = true;
      setStatus(submitStatus, t.saving);

      try {
        const previousToday = profile.today;
        await refreshProfile();
        if (previousToday !== profile.today && selectedDate === previousToday) {
          selectedDate = previousToday;
          renderDateControls();
          throw new Error(locale === 'en' ? 'Your local date changed. Review the selected practice date and submit again.' : locale === 'zh_CN' ? '当地日期已变更，请确认练功日期后再次提交。' : '當地日期已變更，請確認練功日期後再次送出。');
        }
        const result = await apiFetch('/telegram/api/webapp/checkin', {
          method: 'POST',
          body: JSON.stringify({
            methodIds,
            checkinDate: selectedDate,
            practiceNote: practiceNote.value,
            reflectionNote: practiceNote.value,
            bodyFeelingNote: ''
          })
        });

        const streakText = result.stats ? ` | ${t.streak(result.stats.currentStreak)} | ${t.total(result.stats.totalCheckins)}` : '';
        const badgeText = result.unlockedBadges && result.unlockedBadges.length > 0
          ? ` | ${t.unlocked}${result.unlockedBadges.map(b => `${b.emoji} ${b.name}`).join(locale === 'en' ? ', ' : '、')}`
          : '';
        const successLabel = result.entryKind === 'makeup' ? t.successMakeup(shortDate(result.date)) : t.successToday(shortDate(result.date));
        setStatus(submitStatus, `${successLabel}${result.selectedMethods.join(locale === 'en' ? ', ' : '、')}${streakText}${badgeText}`, 'success');
        todayStatus.textContent = t.saved(shortDate(result.date), result.entryKind === 'makeup');
        drafts.set(result.date, { selectedMethodIds: methodIds, practiceNote: practiceNote.value, alreadyCheckedIn: true });
        if (tg?.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('success');
        }

        if (tg?.close) {
          tg.close();
          return;
        }
      } catch (error) {
        setStatus(submitStatus, `${t.saveFailed}${error.message}`, 'error');
      } finally {
        submitButton.disabled = false;
      }
    });

    todayTab.addEventListener('click', async () => {
      try {
        await refreshProfile();
        await loadCheckinDate(profile.today);
      } catch (error) {
        setStatus(submitStatus, `${t.loadFailed}${error.message}`, 'error');
      }
    });
    makeupTab.addEventListener('click', async () => {
      try {
        await refreshProfile();
        if (!profile.canMakeupYesterday) throw new Error(t.makeupClosed(shortDate(profile.yesterday)));
        await loadCheckinDate(profile.yesterday);
      } catch (error) {
        setStatus(submitStatus, `${t.loadFailed}${error.message}`, 'error');
      }
    });
    changeTimezone.addEventListener('click', () => {
      if (!profile) return;
      timezoneInput.value = profile.practiceTimezone;
      timezoneCard.hidden = false;
      timezoneCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    saveTimezone.addEventListener('click', async () => {
      saveTimezone.disabled = true;
      setStatus(timezoneStatus, t.saving);
      try {
        profile = { ...profile, ...(await apiFetch('/telegram/api/webapp/profile/practice-timezone', {
          method: 'PATCH',
          body: JSON.stringify({ timezone: timezoneInput.value.trim() })
        }, false)) };
        timezoneCard.hidden = profile.confirmed;
        selectedDate = profile.today;
        drafts.clear();
        renderDateControls();
        setStatus(timezoneStatus, t.timezoneSaved, 'success');
        await load();
      } catch (error) {
        setStatus(timezoneStatus, `${t.timezoneSaveFailed}${error.message}`, 'error');
      } finally {
        saveTimezone.disabled = false;
      }
    });

    languageSelect.addEventListener('change', async () => {
      const nextLocale = languageSelect.value;
      languageSelect.disabled = true;
      try {
        await persistProfileLocale(nextLocale);
        locale = nextLocale;
        localStorage.setItem(localeKey, locale);
        applyTranslations();
        redrawMethods();
        await load();
      } catch (error) {
        console.error('Failed to persist WebApp locale', error);
        applyTranslations();
      } finally {
        languageSelect.disabled = false;
      }
    });

    const initialize = async () => {
      applyTranslations();
      languageSelect.disabled = true;
      submitButton.disabled = true;
      try {
        if (getInitData()) {
          const profileData = await apiFetch('/telegram/api/webapp/profile', {}, false);
          profile = profileData;
          if (translations[profile.locale]) locale = profile.locale;
          localStorage.setItem(localeKey, locale);
          applyTranslations();
          const detectedTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
          timezoneInput.value = profile.confirmed ? profile.practiceTimezone : (detectedTimezone || profile.practiceTimezone);
          timezoneCard.hidden = profile.confirmed;
          selectedDate = profile.today;
          renderDateControls();
        } else {
          profileReady = true;
          await load();
          return;
        }
        profileReady = true;
        if (profile?.confirmed) await load();
      } catch (error) {
        console.error('Failed to load WebApp locale profile', error);
        timezoneCard.hidden = true;
        methodsCard.hidden = true;
        noteCard.hidden = true;
        submitButton.hidden = true;
        todayStatus.textContent = `${t.loadFailed}${error.message}`;
        todayStatus.className = 'hint error';
        profileReady = true;
      } finally {
        languageSelect.disabled = false;
        submitButton.disabled = false;
      }
    };
    initialize();
  </script>
</body>
</html>
