<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>氣功打卡</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f6f7fb; color: #1f2937; }
    .container { max-width: 640px; margin: 0 auto; padding: 20px; }
    .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.08); margin-bottom: 16px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .muted { color: #6b7280; font-size: 14px; }
    .method-group { border-bottom: 1px solid #f3f4f6; padding: 6px 0; }
    .method-group:last-child { border-bottom: 0; }
    .method-row { display: flex; align-items: center; gap: 10px; }
    .method-label { display: flex; align-items: center; gap: 10px; flex: 1; padding: 8px 0; }
    .toggle-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; color: #374151; font-size: 18px; line-height: 1; padding: 0; flex-shrink: 0; }
    .toggle-spacer { width: 30px; height: 30px; flex-shrink: 0; }
    .child-list { margin-left: 40px; padding-bottom: 4px; }
    .child-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
    .child-label { display: flex; align-items: center; gap: 10px; flex: 1; color: #4b5563; }
    .method-hint { color: #9ca3af; font-size: 12px; }
    textarea { width: 100%; min-height: 96px; border: 1px solid #d1d5db; border-radius: 10px; padding: 12px; font-size: 14px; box-sizing: border-box; }
    button { width: 100%; background: #0d6efd; color: #fff; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:disabled { background: #9ca3af; }
    .hint { background: #eff6ff; color: #1d4ed8; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
    .status { margin-top: 12px; font-size: 14px; }
    .error { color: #b91c1c; }
    .success { color: #166534; }
    .language-row { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    .language-select { width: auto; border: 1px solid #d1d5db; border-radius: 10px; background: #fff; color: #1f2937; padding: 8px 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="language-row"><select id="languageSelect" class="language-select" aria-label="語言"><option value="zh_TW">繁體中文</option><option value="zh_CN">简体中文</option><option value="en">English</option></select></div>
    <div class="card">
      <h1 data-i18n="heading">今日打卡</h1>
      <p class="muted" data-i18n="intro">請勾選今天練習的功法，並可選填練功心得與感受。</p>
      <div class="hint" id="todayStatus"></div>
    </div>

    <div class="card">
      <h2 data-i18n="methodsHeading">今日功法（可複選）</h2>
      <div id="methodsContainer"></div>
    </div>

    <div class="card">
      <h2 data-i18n="practiceNoteHeading">練功心得與身體感受（選填）</h2>
      <textarea id="practiceNote" maxlength="1000"></textarea>
    </div>

    <button type="button" id="submitButton" data-i18n="submit">完成打卡</button>
    <div id="submitStatus" class="status"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const translations = {
      zh_TW: {
        title: '氣功打卡', language: '語言', heading: '今日打卡', intro: '請勾選今天練習的功法，並可選填練功心得與感受。', loadingToday: '正在載入今日打卡資料...', methodsHeading: '今日功法（可複選）', practiceNoteHeading: '練功心得與身體感受（選填）', practiceNotePlaceholder: '記錄今天練功的心得、身體感受或其他體會...', submit: '完成打卡', selectAllChildren: '勾選即全選子招式', authError: '尚未取得 Telegram 驗證資訊，請從 Telegram App 內重新開啟打卡頁。', requestFailed: '請求失敗', methodsLoadFailed: '功法列表載入失敗：', todayLoadFailed: '今日打卡資料載入失敗：', alreadyCheckedIn: '你今天已打卡，可修改今日內容後重新送出。', notCheckedIn: '今天尚未打卡，請完成以下內容後送出。', loadFailed: '載入失敗：', selectMethod: '請至少勾選一個功法。', saving: '正在儲存打卡資料...', streak: (n) => `連續 ${n} 天`, total: (n) => `總計 ${n} 天`, unlocked: '解鎖：', success: '打卡成功：', saved: '今天的打卡內容已儲存，你可以再次修改後重新送出。', saveFailed: '儲存失敗：'
      },
      zh_CN: {
        title: '气功打卡', language: '语言', heading: '今日打卡', intro: '请选择今天练习的功法，并可选填练功心得与感受。', loadingToday: '正在加载今日打卡数据...', methodsHeading: '今日功法（可多选）', practiceNoteHeading: '练功心得与身体感受（选填）', practiceNotePlaceholder: '记录今天练功的心得、身体感受或其他体会...', submit: '完成打卡', selectAllChildren: '勾选即全选子招式', authError: '尚未取得 Telegram 验证信息，请从 Telegram App 内重新打开打卡页。', requestFailed: '请求失败', methodsLoadFailed: '功法列表加载失败：', todayLoadFailed: '今日打卡数据加载失败：', alreadyCheckedIn: '你今天已打卡，可修改今日内容后重新提交。', notCheckedIn: '今天尚未打卡，请完成以下内容后提交。', loadFailed: '加载失败：', selectMethod: '请至少选择一个功法。', saving: '正在保存打卡数据...', streak: (n) => `连续 ${n} 天`, total: (n) => `总计 ${n} 天`, unlocked: '解锁：', success: '打卡成功：', saved: '今天的打卡内容已保存，你可以再次修改后重新提交。', saveFailed: '保存失败：'
      },
      en: {
        title: 'Qigong Check-in', language: 'Language', heading: 'Today’s Check-in', intro: 'Select the methods you practiced today. You may also add one practice note.', loadingToday: 'Loading today’s check-in...', methodsHeading: 'Today’s Methods (select all that apply)', practiceNoteHeading: 'Practice Reflection and Physical Sensations (optional)', practiceNotePlaceholder: 'Record reflections, physical sensations, or anything else from today’s practice...', submit: 'Complete Check-in', selectAllChildren: 'Selects all child forms', authError: 'Telegram authentication is unavailable. Please reopen this page in the Telegram app.', requestFailed: 'Request failed', methodsLoadFailed: 'Could not load practice methods: ', todayLoadFailed: 'Could not load today’s check-in: ', alreadyCheckedIn: 'You have checked in today. You can edit the details and submit again.', notCheckedIn: 'You have not checked in today. Complete the details below to continue.', loadFailed: 'Could not load data: ', selectMethod: 'Select at least one practice method.', saving: 'Saving your check-in...', streak: (n) => `${n}-day streak`, total: (n) => `${n} days total`, unlocked: 'Unlocked: ', success: 'Check-in successful: ', saved: 'Today’s check-in has been saved. You can edit and submit it again.', saveFailed: 'Could not save: '
      }
    };
    const localeKey = 'qigong_telegram_locale';
    const telegramLanguage = tg?.initDataUnsafe?.user?.language_code || '';
    const mapLocale = (code) => ['zh-hans', 'zh-cn', 'zh-sg'].includes(String(code).toLowerCase()) ? 'zh_CN' : (/^en(?:-|$)/i.test(String(code)) ? 'en' : 'zh_TW');
    const storedLocale = localStorage.getItem(localeKey);
    let locale = translations[storedLocale] ? storedLocale : mapLocale(telegramLanguage);
    let t = translations[locale];

    const methodsContainer = document.getElementById('methodsContainer');
    const practiceNote = document.getElementById('practiceNote');
    const submitButton = document.getElementById('submitButton');
    const submitStatus = document.getElementById('submitStatus');
    const todayStatus = document.getElementById('todayStatus');
    const languageSelect = document.getElementById('languageSelect');
    let practiceMethods = [];
    let selectedMethodIds = new Set();
    let expandedMethodIds = new Set();
    let profileReady = false;

    const getInitData = () => window.Telegram?.WebApp?.initData || '';
    const localizedUrl = (url) => `${url}${url.includes('?') ? '&' : '?'}locale=${encodeURIComponent(locale)}`;
    const getMethodName = (method) => (locale === 'en' ? method.nameEn : locale === 'zh_CN' ? method.nameZhCn : method.nameZh) || method.nameZh || '';
    const mergeLegacyNotes = (reflection = '', bodyFeeling = '') => {
      const reflectionText = reflection.trim();
      const bodyFeelingText = bodyFeeling.trim();
      if (!reflectionText || !bodyFeelingText) return reflectionText || bodyFeelingText;
      return `${reflectionText}\n${bodyFeelingText}`;
    };

    const applyTranslations = () => {
      t = translations[locale];
      document.documentElement.lang = locale === 'en' ? 'en' : locale === 'zh_CN' ? 'zh-Hans' : 'zh-Hant';
      document.title = t.title;
      document.querySelectorAll('[data-i18n]').forEach((element) => { element.textContent = t[element.dataset.i18n]; });
      languageSelect.value = locale;
      languageSelect.setAttribute('aria-label', t.language);
      practiceNote.placeholder = t.practiceNotePlaceholder;
    };

    const setStatus = (el, message, className = '') => {
      el.textContent = message;
      el.className = `status ${className}`.trim();
    };

    const apiFetch = async (url, options = {}, includeLocale = true) => {
      const initData = getInitData();
      if (!initData) {
        throw new Error(t.authError);
      }
      const headers = new Headers(options.headers || {});
      headers.set('x-telegram-init-data', initData);
      if (!headers.has('Content-Type') && options.method && options.method !== 'GET') {
        headers.set('Content-Type', 'application/json');
      }
      const res = await fetch(includeLocale ? localizedUrl(url) : url, { ...options, headers });
      if (!res.ok) {
        const body = await res.json().catch(() => ({ error: t.requestFailed }));
        throw new Error(body.error || t.requestFailed);
      }
      return res.status === 204 ? null : res.json();
    };

    const persistProfileLocale = (nextLocale) => apiFetch('/telegram/api/webapp/profile/language', {
      method: 'PATCH',
      body: JSON.stringify({ locale: nextLocale })
    }, false);

    const normalizeSelectedIds = (methods, selectedIds) => {
      const normalized = new Set();
      const incoming = new Set(selectedIds);

      methods.forEach((method) => {
        if (method.children && method.children.length > 0) {
          if (incoming.has(method.id)) {
            method.children.forEach((child) => normalized.add(child.id));
          }
          method.children.forEach((child) => {
            if (incoming.has(child.id)) normalized.add(child.id);
          });
          return;
        }

        if (incoming.has(method.id)) {
          normalized.add(method.id);
        }
      });

      return normalized;
    };

    const getParentSelectionState = (method) => {
      if (!method.children || method.children.length === 0) {
        return { checked: selectedMethodIds.has(method.id), indeterminate: false };
      }

      const selectedCount = method.children.filter((child) => selectedMethodIds.has(child.id)).length;
      return {
        checked: selectedCount === method.children.length,
        indeterminate: selectedCount > 0 && selectedCount < method.children.length
      };
    };

    const redrawMethods = () => {
      methodsContainer.innerHTML = '';
      practiceMethods.forEach((method) => {
        const group = document.createElement('div');
        group.className = 'method-group';

        const row = document.createElement('div');
        row.className = 'method-row';

        if (method.children && method.children.length > 0) {
          const toggleButton = document.createElement('button');
          toggleButton.type = 'button';
          toggleButton.className = 'toggle-btn';
          toggleButton.dataset.action = 'toggle';
          toggleButton.dataset.methodId = String(method.id);
          toggleButton.textContent = expandedMethodIds.has(method.id) ? '−' : '+';
          row.appendChild(toggleButton);
        } else {
          const spacer = document.createElement('span');
          spacer.className = 'toggle-spacer';
          row.appendChild(spacer);
        }

        const label = document.createElement('label');
        label.className = 'method-label';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.dataset.action = 'parent-check';
        checkbox.dataset.methodId = String(method.id);

        const state = getParentSelectionState(method);
        checkbox.checked = state.checked;
        checkbox.indeterminate = state.indeterminate;

        const textWrap = document.createElement('div');
        textWrap.appendChild(document.createTextNode(getMethodName(method)));
        if (method.children && method.children.length > 0) {
          const hint = document.createElement('span');
          hint.className = 'method-hint';
          hint.textContent = ` ${t.selectAllChildren}`;
          textWrap.appendChild(hint);
        }

        label.appendChild(checkbox);
        label.appendChild(textWrap);
        row.appendChild(label);
        group.appendChild(row);

        if (method.children && method.children.length > 0 && expandedMethodIds.has(method.id)) {
          const childList = document.createElement('div');
          childList.className = 'child-list';

          method.children.forEach((child) => {
            const childRow = document.createElement('div');
            childRow.className = 'child-row';

            const childLabel = document.createElement('label');
            childLabel.className = 'child-label';

            const childCheckbox = document.createElement('input');
            childCheckbox.type = 'checkbox';
            childCheckbox.dataset.action = 'child-check';
            childCheckbox.dataset.methodId = String(child.id);
            childCheckbox.checked = selectedMethodIds.has(child.id);

            const childText = document.createElement('span');
            childText.textContent = getMethodName(child);

            childLabel.appendChild(childCheckbox);
            childLabel.appendChild(childText);
            childRow.appendChild(childLabel);
            childList.appendChild(childRow);
          });

          group.appendChild(childList);
        }

        methodsContainer.appendChild(group);
      });
    };

    const getSelectedMethodIds = () => {
      const ids = [];
      practiceMethods.forEach((method) => {
        if (method.children && method.children.length > 0) {
          method.children.forEach((child) => {
            if (selectedMethodIds.has(child.id)) ids.push(child.id);
          });
        } else if (selectedMethodIds.has(method.id)) {
          ids.push(method.id);
        }
      });
      return ids;
    };

    const renderMethods = (methods, selectedIds = []) => {
      practiceMethods = methods;
      selectedMethodIds = normalizeSelectedIds(methods, selectedIds);
      expandedMethodIds = new Set(methods.filter((method) => {
        if (!method.children || method.children.length === 0) return false;
        return method.children.some((child) => selectedMethodIds.has(child.id)) || selectedIds.includes(method.id);
      }).map((method) => method.id));
      redrawMethods();
    };

    methodsContainer.addEventListener('click', (event) => {
      const toggleButton = event.target.closest('button[data-action="toggle"]');
      if (!toggleButton) return;

      const methodId = Number(toggleButton.dataset.methodId);
      if (expandedMethodIds.has(methodId)) {
        expandedMethodIds.delete(methodId);
      } else {
        expandedMethodIds.add(methodId);
      }
      redrawMethods();
    });

    methodsContainer.addEventListener('change', (event) => {
      const target = event.target;
      if (!(target instanceof HTMLInputElement)) return;

      if (target.dataset.action === 'parent-check') {
        const methodId = Number(target.dataset.methodId);
        const method = practiceMethods.find((item) => item.id === methodId);
        if (!method) return;

        if (method.children && method.children.length > 0) {
          method.children.forEach((child) => {
            if (target.checked) selectedMethodIds.add(child.id);
            else selectedMethodIds.delete(child.id);
          });
        } else if (target.checked) {
          selectedMethodIds.add(method.id);
        } else {
          selectedMethodIds.delete(method.id);
        }

        redrawMethods();
        return;
      }

      if (target.dataset.action === 'child-check') {
        const methodId = Number(target.dataset.methodId);
        if (target.checked) selectedMethodIds.add(methodId);
        else selectedMethodIds.delete(methodId);
        redrawMethods();
      }
    });

    const load = async () => {
      if (!profileReady && getInitData()) return;
      todayStatus.textContent = t.loadingToday;
      todayStatus.className = 'hint';
      submitStatus.textContent = '';
      try {
        if (!getInitData()) {
          todayStatus.textContent = t.authError;
          todayStatus.className = 'hint error';
          return;
        }

        const methodsResp = await apiFetch('/telegram/api/webapp/practice-methods').catch((error) => {
          throw new Error(`${t.methodsLoadFailed}${error.message}`);
        });

        const todayResp = await apiFetch('/telegram/api/webapp/checkin/today').catch((error) => {
          throw new Error(`${t.todayLoadFailed}${error.message}`);
        });

        renderMethods(methodsResp.methods, todayResp.selectedMethodIds);
        practiceNote.value = todayResp.practiceNote || mergeLegacyNotes(todayResp.reflectionNote, todayResp.bodyFeelingNote);

        todayStatus.textContent = todayResp.alreadyCheckedIn
          ? t.alreadyCheckedIn
          : t.notCheckedIn;
      } catch (error) {
        todayStatus.textContent = `${t.loadFailed}${error.message}`;
        todayStatus.className = 'hint error';
      }
    };

    submitButton.addEventListener('click', async () => {
      const methodIds = getSelectedMethodIds();
      if (methodIds.length === 0) {
        setStatus(submitStatus, t.selectMethod, 'error');
        return;
      }

      submitButton.disabled = true;
      setStatus(submitStatus, t.saving);

      try {
        const result = await apiFetch('/telegram/api/webapp/checkin', {
          method: 'POST',
          body: JSON.stringify({
            methodIds,
            practiceNote: practiceNote.value,
            reflectionNote: practiceNote.value,
            bodyFeelingNote: ''
          })
        });

        const streakText = result.stats ? ` | ${t.streak(result.stats.currentStreak)} | ${t.total(result.stats.totalCheckins)}` : '';
        const badgeText = result.unlockedBadges && result.unlockedBadges.length > 0
          ? ` | ${t.unlocked}${result.unlockedBadges.map(b => `${b.emoji} ${b.name}`).join(locale === 'en' ? ', ' : '、')}`
          : '';
        setStatus(submitStatus, `${t.success}${result.selectedMethods.join(locale === 'en' ? ', ' : '、')}${streakText}${badgeText}`, 'success');
        todayStatus.textContent = t.saved;
        if (tg?.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('success');
        }

        if (tg?.close) {
          tg.close();
          return;
        }
      } catch (error) {
        setStatus(submitStatus, `${t.saveFailed}${error.message}`, 'error');
      } finally {
        submitButton.disabled = false;
      }
    });

    languageSelect.addEventListener('change', async () => {
      const nextLocale = languageSelect.value;
      languageSelect.disabled = true;
      try {
        await persistProfileLocale(nextLocale);
        locale = nextLocale;
        localStorage.setItem(localeKey, locale);
        applyTranslations();
        redrawMethods();
        await load();
      } catch (error) {
        console.error('Failed to persist WebApp locale', error);
        applyTranslations();
      } finally {
        languageSelect.disabled = false;
      }
    });

    const initialize = async () => {
      applyTranslations();
      languageSelect.disabled = true;
      submitButton.disabled = true;
      try {
        if (getInitData()) {
          const profile = await apiFetch('/telegram/api/webapp/profile', {}, false);
          if (translations[profile.locale]) locale = profile.locale;
          localStorage.setItem(localeKey, locale);
          applyTranslations();
        }
        profileReady = true;
        await load();
      } catch (error) {
        console.error('Failed to load WebApp locale profile', error);
        profileReady = true;
        await load();
      } finally {
        languageSelect.disabled = false;
        submitButton.disabled = false;
      }
    };
    initialize();
  </script>
</body>
</html>
