<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>氣功排行榜</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{color-scheme:light dark}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:var(--tg-theme-secondary-bg-color,#f1f5f9);color:var(--tg-theme-text-color,#172033)}
    .container{max-width:720px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
    .hero{background:linear-gradient(135deg,#172554,#4338ca 55%,#7c3aed);color:#fff;border-radius:24px;padding:24px;box-shadow:0 18px 45px rgba(49,46,129,.28)}
    h1{font-size:28px;margin:0 0 7px}.subtitle{opacity:.8;font-size:14px}
    .periods{display:flex;gap:8px;overflow-x:auto;padding:16px 0 8px;scrollbar-width:none}.periods::-webkit-scrollbar{display:none}
    button{border:0;border-radius:999px;padding:10px 15px;font-weight:700;white-space:nowrap;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#172033);box-shadow:0 4px 15px rgba(15,23,42,.08)}
    button.active{background:var(--tg-theme-button-color,#4f46e5);color:var(--tg-theme-button-text-color,#fff)}
    .card{background:var(--tg-theme-bg-color,#fff);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 10px 30px rgba(15,23,42,.08)}
    .switch{display:grid;grid-template-columns:1fr 1fr;background:var(--tg-theme-secondary-bg-color,#eef2ff);border-radius:14px;padding:4px;gap:4px}
    .switch button{box-shadow:none;border-radius:11px;padding:11px 8px;background:transparent;color:var(--tg-theme-hint-color,#64748b)}
    .switch button.active{background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-button-color,#4338ca);box-shadow:0 3px 10px rgba(15,23,42,.08)}
    .list{display:flex;flex-direction:column;gap:9px;margin-top:16px}
    .entry{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;padding:13px 12px;border:1px solid rgba(148,163,184,.18);border-radius:15px}
    .entry.me{border-color:#8b5cf6;background:rgba(139,92,246,.1)}
    .rank{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--tg-theme-secondary-bg-color,#f1f5f9);font-weight:800}
    .entry:nth-child(1) .rank{background:#fef3c7;color:#a16207}.entry:nth-child(2) .rank{background:#e2e8f0;color:#475569}.entry:nth-child(3) .rank{background:#ffedd5;color:#c2410c}
    .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.you{font-size:11px;color:#7c3aed;margin-left:6px}
    .value{font-weight:800;color:var(--tg-theme-button-color,#4338ca)}
    .state{text-align:center;padding:32px 12px;color:var(--tg-theme-hint-color,#64748b)}.error{color:#b91c1c}
    .language-row{display:flex;justify-content:flex-end;margin-bottom:12px}.language-select{border:1px solid rgba(148,163,184,.45);border-radius:10px;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#172033);padding:8px 10px;font-size:14px}
  </style>
</head>
<body>
  <main class="container">
    <div class="language-row"><select id="languageSelect" class="language-select" aria-label="語言"><option value="zh_TW">繁體中文</option><option value="zh_CN">简体中文</option><option value="en">English</option></select></div>
    <section class="hero">
      <h1 data-i18n="heading">🏆 精進排行榜</h1>
      <div class="subtitle" data-i18n="subtitle">每一天的持續，都在累積看得見的功夫。</div>
    </section>
    <nav class="periods" id="periods" aria-label="排行榜期間">
      <button data-period="week" class="active" data-i18n="week">本週</button>
      <button data-period="month" data-i18n="month">本月</button>
      <button data-period="quarter" data-i18n="quarter">本季</button>
      <button data-period="year" data-i18n="year">本年</button>
      <button data-period="all" data-i18n="all">總榜</button>
    </nav>
    <section class="card">
      <div class="switch">
        <button data-mode="totals" class="active" data-i18n="totals">總打卡天數</button>
        <button data-mode="streaks" data-i18n="streaks">最長連續天數</button>
      </div>
      <div id="list" class="list"></div>
    </section>
  </main>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    const initData = tg?.initData || '';
    const translations = {
      zh_TW:{title:'氣功排行榜',language:'語言',periodLabel:'排行榜期間',heading:'🏆 精進排行榜',subtitle:'每一天的持續，都在累積看得見的功夫。',week:'本週',month:'本月',quarter:'本季',year:'本年',all:'總榜',totals:'總打卡天數',streaks:'最長連續天數',loading:'正在載入排行榜...',empty:'這個期間還沒有打卡資料。',you:'你',days:(n)=>`${n} 天`,authError:'請從 Telegram App 內開啟排行榜。',loadFailed:'排行榜載入失敗'},
      zh_CN:{title:'气功排行榜',language:'语言',periodLabel:'排行榜期间',heading:'🏆 精进排行榜',subtitle:'每一天的坚持，都在累积看得见的功夫。',week:'本周',month:'本月',quarter:'本季度',year:'本年',all:'总榜',totals:'总打卡天数',streaks:'最长连续天数',loading:'正在加载排行榜...',empty:'这个期间还没有打卡数据。',you:'你',days:(n)=>`${n} 天`,authError:'请从 Telegram App 内打开排行榜。',loadFailed:'排行榜加载失败'},
      en:{title:'Qigong Leaderboard',language:'Language',periodLabel:'Leaderboard period',heading:'🏆 Practice Leaderboard',subtitle:'Every day of consistency builds visible progress.',week:'This Week',month:'This Month',quarter:'This Quarter',year:'This Year',all:'All Time',totals:'Total Check-in Days',streaks:'Longest Streak',loading:'Loading leaderboard...',empty:'No check-in data for this period.',you:'You',days:(n)=>`${n} ${Number(n) === 1 ? 'day' : 'days'}`,authError:'Please open the leaderboard in the Telegram app.',loadFailed:'Could not load the leaderboard'}
    };
    const localeKey = 'qigong_telegram_locale';
    const mapLocale = (code) => ['zh-hans','zh-cn','zh-sg'].includes(String(code).toLowerCase()) ? 'zh_CN' : (/^en(?:-|$)/i.test(String(code)) ? 'en' : 'zh_TW');
    const storedLocale = localStorage.getItem(localeKey);
    let locale = translations[storedLocale] ? storedLocale : mapLocale(tg?.initDataUnsafe?.user?.language_code || '');
    let t = translations[locale];
    let currentPeriod = 'week';
    let currentMode = 'totals';
    let currentData = null;
    let requestVersion = 0;
    let profileReady = false;
    const escapeHtml = (value) => String(value || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

    const apiFetch = async (url, options = {}, includeLocale = true) => {
      if (!initData) throw new Error(t.authError);
      const localizedUrl = `${url}${url.includes('?') ? '&' : '?'}locale=${encodeURIComponent(locale)}`;
      const headers = new Headers(options.headers || {});
      headers.set('x-telegram-init-data', initData);
      if (!headers.has('Content-Type') && options.method && options.method !== 'GET') headers.set('Content-Type', 'application/json');
      const response = await fetch(includeLocale ? localizedUrl : url, { ...options, headers });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.error || t.loadFailed);
      }
      return response.status === 204 ? null : response.json();
    };

    const persistProfileLocale = (nextLocale) => apiFetch('/telegram/api/webapp/profile/language', {
      method: 'PATCH',
      body: JSON.stringify({ locale: nextLocale })
    }, false);

    const setActiveButtons = () => {
      document.querySelectorAll('[data-period]').forEach((button) => button.classList.toggle('active', button.dataset.period === currentPeriod));
      document.querySelectorAll('[data-mode]').forEach((button) => button.classList.toggle('active', button.dataset.mode === currentMode));
    };

    const render = () => {
      const list = document.getElementById('list');
      const rows = currentMode === 'totals' ? (currentData?.totals || []) : (currentData?.streaks || []);
      if (!rows.length) {
        list.innerHTML = `<div class="state">${t.empty}</div>`;
        return;
      }
      list.innerHTML = rows.map((row) => {
        const value = currentMode === 'totals' ? row.totalDays : row.maxStreak;
        return `<div class="entry ${row.isCurrentUser ? 'me' : ''}">
          <div class="rank">${Number(row.rank)}</div>
          <div class="name">${escapeHtml(row.displayName)}${row.isCurrentUser ? `<span class="you">${t.you}</span>` : ''}</div>
          <div class="value">${t.days(Number(value || 0))}</div>
        </div>`;
      }).join('');
    };

    const load = async () => {
      if (!profileReady && initData) return;
      if (!initData) {
        document.getElementById('list').innerHTML = `<div class="state error">${t.authError}</div>`;
        return;
      }
      const version = ++requestVersion;
      document.getElementById('list').innerHTML = `<div class="state">${t.loading}</div>`;
      try {
        const data = await apiFetch(`/telegram/api/webapp/leaderboard?period=${currentPeriod}`);
        if (version !== requestVersion) return;
        currentData = data;
        render();
      } catch (error) {
        if (version !== requestVersion) return;
        document.getElementById('list').innerHTML = `<div class="state error">${escapeHtml(error.message || t.loadFailed)}</div>`;
      }
    };

    document.querySelectorAll('[data-period]').forEach((button) => button.onclick = () => {
      currentPeriod = button.dataset.period;
      setActiveButtons();
      load();
    });
    document.querySelectorAll('[data-mode]').forEach((button) => button.onclick = () => {
      currentMode = button.dataset.mode;
      setActiveButtons();
      render();
    });
    const languageSelect = document.getElementById('languageSelect');
    const applyTranslations = () => {
      t = translations[locale];
      document.documentElement.lang = locale === 'en' ? 'en' : locale === 'zh_CN' ? 'zh-Hans' : 'zh-Hant';
      document.title = t.title;
      document.querySelectorAll('[data-i18n]').forEach((element) => { element.textContent = t[element.dataset.i18n]; });
      document.getElementById('periods').setAttribute('aria-label', t.periodLabel);
      languageSelect.value = locale;
      languageSelect.setAttribute('aria-label', t.language);
    };
    languageSelect.addEventListener('change', async () => {
      const nextLocale = languageSelect.value;
      languageSelect.disabled = true;
      try {
        await persistProfileLocale(nextLocale);
        locale = nextLocale;
        localStorage.setItem(localeKey, locale);
        applyTranslations();
        currentData = null;
        await load();
      } catch (error) {
        console.error('Failed to persist WebApp locale', error);
        applyTranslations();
      } finally {
        languageSelect.disabled = false;
      }
    });

    const initialize = async () => {
      applyTranslations();
      setActiveButtons();
      languageSelect.disabled = true;
      try {
        if (initData) {
          const profile = await apiFetch('/telegram/api/webapp/profile', {}, false);
          if (translations[profile.locale]) locale = profile.locale;
          localStorage.setItem(localeKey, locale);
          applyTranslations();
        }
        profileReady = true;
        await load();
      } catch (error) {
        console.error('Failed to load WebApp locale profile', error);
        profileReady = true;
        await load();
      } finally {
        languageSelect.disabled = false;
      }
    };
    initialize();
  </script>
</body>
</html>
